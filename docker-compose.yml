services:
  teleprompter:
    build: .
    restart: unless-stopped
    ports:
      - "8080"
    environment:
      # Optional TURN config (see src/backend/ice.go) — leave unset to use
      # only the default public STUN server.
      - STUN_URLS=${STUN_URLS:-}
      - TURN_URLS=${TURN_URLS:-}
      - TURN_SECRET=${TURN_SECRET:-}
      - TURN_TTL=${TURN_TTL:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
