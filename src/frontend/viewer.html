<!DOCTYPE html>
<html lang="en" class="wa-theme-shoelace wa-palette-shoelace wa-brand-blue wa-dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The same icon the control page uses. Without it every display 404s on
       /favicon.ico as it loads, which is noise in the one console an operator
       looks at when a screen misbehaves. -->
  <link rel="icon" href="/icons/tv-solid-full.svg" type="image/svg+xml">
  <title>Viewer</title>
  <script type="module" defer src="./scripts/viewerApp.ts"></script>
</head>

<body class="theme-default">
  <!-- The stage is the box the script is laid out in, and it is sized to the
       *reference* display rather than to this screen: every display lays out
       identically and scales the result to fit, so one shared scroll ratio
       lands on the same line everywhere. Told no dimensions, it takes this
       screen's own and the scale is 1, which is how a lone display behaves
       exactly as it did before the stage existed. See StageMessage.

       It is also the scroller. The viewport is not: viewerBase.css clips both
       html and body, so nothing can scroll the page out from under the stage. -->
  <div id="stage">
    <header id="header" class="viewer-clocks">
      <tp-clock class="left" id="timeTimer" type="timer" timer="00:00:00">00:00:00</tp-clock>
      <span id="message" class="mid"></span>
      <tp-clock class="right" id="timeClock" type="clock"></tp-clock>
    </header>
    <main id="main" class="content">

    </main>
  </div>
</body>

</html>
