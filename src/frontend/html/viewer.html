<!DOCTYPE html>
<html lang="en" class="wa-theme-shoelace wa-palette-shoelace wa-brand-blue wa-dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viewer</title>
  <script type="module" defer src="../scripts/viewerApp.ts"></script>
</head>

<body class="theme-default">
  <header id="header" class="viewer-clocks">
    <tp-clock class="left" id="timeTimer" type="timer" timer="00:00:00">00:00:00</tp-clock>
    <span id="message" class="mid"></span>
    <tp-clock class="right" id="timeClock" type="clock"></tp-clock>
  </header>
  <main id="main" class="content">

  </main>
  <!-- Hidden unless viewer.ts asks for it: only a screen this device opened,
       and only while it is not filling the screen. See #fsPrompt in
       viewerBase.css for why a click here is unavoidable. -->
  <div id="fsPrompt" hidden>
    <span>Click to fill the screen</span>
    <span class="fs-hint">Double-click any time to toggle</span>
  </div>
</body>

</html>
